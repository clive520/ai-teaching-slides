<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 雲端秘書 (Gmail/行事曆/網頁爬蟲)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #1e1e2f;
            --panel-bg: rgba(45, 45, 68, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-email: #ea4335;
            --accent-calendar: #4285f4;
            --accent-browser: #fbbc05;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(234, 67, 53, 0.1), transparent 30%),
                radial-gradient(circle at 80% 20%, rgba(66, 133, 244, 0.15), transparent 30%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 15px 30px;
            background: rgba(30, 30, 47, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .btn-home { background: rgba(255, 255, 255, 0.1); color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-size: 0.9rem; transition: all 0.3s; }
        .btn-home:hover { background: rgba(255, 255, 255, 0.2); }

        .container { display: flex; flex: 1; overflow: hidden; padding: 20px; gap: 20px; }

        /* 左側設定區 */
        .sidebar {
            flex: 0 0 300px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        /* 標籤頁導航 */
        .tabs { display: flex; flex-direction: column; gap: 10px; }
        .tab-btn {
            background: transparent; color: var(--text-secondary); border: 1px solid transparent;
            padding: 12px 15px; border-radius: 8px; text-align: left; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px;
        }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.05); color: white; }
        .tab-btn.active[data-tab="email"] { background: rgba(234, 67, 53, 0.2); color: white; border-color: var(--accent-email); }
        .tab-btn.active[data-tab="calendar"] { background: rgba(66, 133, 244, 0.2); color: white; border-color: var(--accent-calendar); }
        .tab-btn.active[data-tab="browser"] { background: rgba(251, 188, 5, 0.2); color: white; border-color: var(--accent-browser); }

        .api-settings { background: rgba(0, 0, 0, 0.2); padding: 15px; border-radius: 8px; border: 1px dashed var(--border-color); display: flex; flex-direction: column; gap: 8px; }
        .api-settings label { font-size: 0.85rem; color: var(--text-secondary); }
        select, input[type="text"], input[type="password"], textarea {
            background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color); border-radius: 6px;
            padding: 10px; color: white; font-family: inherit; font-size: 0.9rem; width: 100%; box-sizing: border-box;
        }
        select:focus, input:focus, textarea:focus { outline: none; border-color: #4285f4; }

        /* 右側主內容區 */
        .main-content {
            flex: 1; background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 12px;
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        .tab-content { display: none; flex-direction: column; height: 100%; padding: 20px; box-sizing: border-box; gap: 15px; }
        .tab-content.active { display: flex; }

        .action-area { display: flex; gap: 15px; height: 100%; }
        .input-col, .output-col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        
        textarea.main-ta { flex: 1; resize: none; background: rgba(0,0,0,0.2); border-color: var(--border-color); }
        .output-box { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; font-size: 0.9rem; }

        button.run-btn {
            color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: opacity 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px;
        }
        button.run-btn:hover { opacity: 0.9; }
        button.run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-email { background: var(--accent-email); }
        .btn-calendar { background: var(--accent-calendar); }
        .btn-browser { background: #d97706; } /* darker yellow/orange for text readability */

        .toolbar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 5px; }
        .btn-small { background: rgba(255,255,255,0.1); border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .btn-small:hover { background: rgba(255,255,255,0.2); }

        .loader { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(30,30,47,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10; border-radius: 12px;}
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;}
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fa-solid fa-cloud"></i> AI 雲端秘書</h1>
        <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> 返回首頁</a>
    </div>

    <div class="container">
        <!-- 左側設定與導覽 -->
        <div class="sidebar">
            <div class="tabs">
                <button class="tab-btn active" data-tab="email" onclick="switchTab('email')"><i class="fa-solid fa-envelope"></i> 信件處理大師 (Gmail)</button>
                <button class="tab-btn" data-tab="calendar" onclick="switchTab('calendar')"><i class="fa-regular fa-calendar-check"></i> 行程擷取器 (Calendar)</button>
                <button class="tab-btn" data-tab="browser" onclick="switchTab('browser')"><i class="fa-solid fa-globe"></i> 網頁爬蟲腳本生成</button>
            </div>

            <div class="api-settings">
                <div style="font-weight: 600; color: white; margin-bottom: 5px;">API 設定</div>
                <label>選擇服務商</label>
                <select id="providerSelect" onchange="updateModelOptions()">
                    <option value="gemini">Google Gemini</option>
                    <option value="openai">OpenAI</option>
                    <option value="groq">Groq</option>
                </select>
                <label>選擇模型</label>
                <select id="modelSelect"></select>
                <label>API Key</label>
                <input type="password" id="apiKey" placeholder="請輸入 API Key...">
            </div>
        </div>

        <!-- 右側內容 -->
        <div class="main-content">
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <div>AI 處理中...</div>
            </div>

            <!-- Email Tab -->
            <div class="tab-content active" id="tab-email">
                <h2 style="margin:0; font-size: 1.2rem; color: var(--accent-email);"><i class="fa-solid fa-envelope"></i> 智慧信件分析與回覆</h2>
                <div class="action-area">
                    <div class="input-col">
                        <label>貼上您收到的信件內容：</label>
                        <textarea class="main-ta" id="emailInput">你好，我們是上週訂購 50 份便當的客戶。
你們當天遲到了半小時，導致我們會議延誤，而且有 5 份便當的配菜是酸的！
我們非常不滿意，要求你們給個交代並退費，否則以後絕對不會再訂你們家！
王大明 上</textarea>
                        
                        <label>選擇回覆風格：</label>
                        <select id="emailStyle">
                            <option value="professional">專業且誠懇的道歉 (預設)</option>
                            <option value="firm">委婉拒絕不合理要求</option>
                            <option value="brief">簡短確認收到</option>
                        </select>
                        <button class="run-btn btn-email" onclick="processEmail()">生成摘要與回覆</button>
                    </div>
                    <div class="output-col">
                        <div class="toolbar">
                            <button class="btn-small" onclick="copyText('emailOutput')"><i class="fa-regular fa-copy"></i> 複製回覆</button>
                        </div>
                        <div class="output-box" id="emailOutput" style="color: #cbd5e1;">(AI 分析與草稿將顯示於此...)</div>
                    </div>
                </div>
            </div>

            <!-- Calendar Tab -->
            <div class="tab-content" id="tab-calendar">
                <h2 style="margin:0; font-size: 1.2rem; color: var(--accent-calendar);"><i class="fa-regular fa-calendar-check"></i> 智慧行程擷取 (轉出 .ics 行事曆檔)</h2>
                <div class="action-area">
                    <div class="input-col">
                        <label>貼上對話紀錄或信件：</label>
                        <textarea class="main-ta" id="calInput">大明，下週三 (2026/08/12) 下午兩點半我們要跟客戶在「信義區 A11 星巴克」碰面談一下新專案的合約。
大約會談到下午四點，記得帶報價單。
如果有變動我再跟你說！</textarea>
                        <button class="run-btn btn-calendar" onclick="processCalendar()">擷取並生成 .ics 行事曆</button>
                    </div>
                    <div class="output-col">
                        <div class="toolbar">
                            <button class="btn-small" onclick="downloadICS()" id="downloadIcsBtn" style="display:none; background:var(--accent-calendar);"><i class="fa-solid fa-download"></i> 下載 .ics 加入 Google Calendar</button>
                        </div>
                        <div class="output-box" id="calOutput" style="color: #cbd5e1;">(AI 擷取的詳細資訊將顯示於此...)</div>
                    </div>
                </div>
            </div>

            <!-- Browser Tab -->
            <div class="tab-content" id="tab-browser">
                <h2 style="margin:0; font-size: 1.2rem; color: #d97706;"><i class="fa-solid fa-globe"></i> 網頁自動化腳本生成 (Python Selenium)</h2>
                <div class="action-area">
                    <div class="input-col">
                        <label>描述您想要自動化的網頁操作：</label>
                        <textarea class="main-ta" id="browserInput">請幫我寫一個爬蟲，打開 Google 新聞，搜尋「人工智慧」，然後把前 5 篇新聞的標題和網址印出來。請使用 Python 的 selenium 套件，並設定為 headless 模式 (不顯示瀏覽器視窗)。</textarea>
                        <button class="run-btn btn-browser" onclick="processBrowser()">生成 Python 爬蟲腳本</button>
                    </div>
                    <div class="output-col">
                        <div class="toolbar">
                            <button class="btn-small" onclick="downloadPy()" id="downloadPyBtn" style="display:none; background:#d97706;"><i class="fa-solid fa-download"></i> 下載 .py 檔</button>
                            <button class="btn-small" onclick="copyText('browserOutput')"><i class="fa-regular fa-copy"></i> 複製代碼</button>
                        </div>
                        <div class="output-box" id="browserOutput" style="color: #cbd5e1; font-family: 'Fira Code', monospace;">(產生的程式碼將顯示於此...)</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const models = {
            gemini: ["gemini-1.5-flash", "gemini-1.5-pro"],
            openai: ["gpt-4o-mini", "gpt-4o"],
            groq: ["llama3-70b-8192", "mixtral-8x7b-32768"]
        };

        let currentIcsData = null;
        let currentPyCode = null;

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('providerSelect').value = localStorage.getItem('ta_provider') || 'gemini';
            updateModelOptions();
            document.getElementById('modelSelect').value = localStorage.getItem('ta_model') || models[document.getElementById('providerSelect').value][0];
            document.getElementById('apiKey').value = localStorage.getItem('ta_apikey') || '';
        });

        document.getElementById('apiKey').addEventListener('input', (e) => localStorage.setItem('ta_apikey', e.target.value));
        document.getElementById('providerSelect').addEventListener('change', (e) => localStorage.setItem('ta_provider', e.target.value));
        document.getElementById('modelSelect').addEventListener('change', (e) => localStorage.setItem('ta_model', e.target.value));

        function updateModelOptions() {
            const provider = document.getElementById('providerSelect').value;
            const select = document.getElementById('modelSelect');
            select.innerHTML = '';
            models[provider].forEach(model => {
                const option = document.createElement('option');
                option.value = model; option.textContent = model;
                select.appendChild(option);
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
            
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        async function callAPI(systemPrompt, userText) {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) { alert("請先輸入 API Key！"); return null; }

            const provider = document.getElementById('providerSelect').value;
            const model = document.getElementById('modelSelect').value;
            document.getElementById('loader').style.display = 'flex';

            let apiUrl = '';
            let requestBody = {};
            let headers = { 'Content-Type': 'application/json' };
            const isGemini = provider === 'gemini';

            if (isGemini) {
                apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                // For JSON mode in Calendar if needed, though prompting is usually enough for simple things
                let config = { temperature: 0.2 };
                if(systemPrompt.includes("JSON")) {
                     config.response_mime_type = "application/json";
                }
                requestBody = {
                    system_instruction: { parts: { text: systemPrompt } },
                    contents: [{ role: "user", parts: [{ text: userText }] }],
                    generationConfig: config
                };
            } else {
                let baseUrl = provider === 'openai' ? 'https://api.openai.com/v1/chat/completions' : 'https://api.groq.com/openai/v1/chat/completions';
                apiUrl = `https://corsproxy.io/?${encodeURIComponent(baseUrl)}`;
                headers['Authorization'] = `Bearer ${apiKey}`;
                
                requestBody = {
                    model: model,
                    messages: [ { role: "system", content: systemPrompt }, { role: "user", content: userText } ],
                    temperature: 0.2
                };
                if(systemPrompt.includes("JSON") && provider === 'openai') {
                     requestBody.response_format = { type: "json_object" };
                }
            }

            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: headers, body: JSON.stringify(requestBody) });
                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`API 請求失敗: ${response.status}\n${err}`);
                }
                const data = await response.json();
                document.getElementById('loader').style.display = 'none';
                if (isGemini) return data.candidates[0].content.parts[0].text;
                return data.choices[0].message.content;
            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                alert(error.message);
                return null;
            }
        }

        // --- Email Logic ---
        async function processEmail() {
            const input = document.getElementById('emailInput').value;
            const style = document.getElementById('emailStyle').options[document.getElementById('emailStyle').selectedIndex].text;
            
            const sysPrompt = `你是一個專業的公關與信件秘書。
請先閱讀使用者的信件，然後輸出以下格式：
【情緒分析】：(簡短說明對方的情緒，如憤怒、期待、詢問等)
【重點摘要】：(條列 1-3 點重點)
【草稿回覆 (${style})】：
(提供一封可以直接複製寄出的完整信件，語氣需符合要求)`;

            const result = await callAPI(sysPrompt, input);
            if(result) document.getElementById('emailOutput').textContent = result;
        }

        // --- Calendar Logic ---
        async function processCalendar() {
            const input = document.getElementById('calInput').value;
            
            const sysPrompt = `你是一個精準的行事曆助理。請從這段文字中萃取活動資訊。
目前的年份是 2026 年。請嚴格輸出純 JSON 格式，不要加 Markdown 標記，格式如下：
{
  "summary": "活動標題",
  "location": "地點",
  "description": "補充說明",
  "dtstart": "YYYYMMDDTHHMMSS",
  "dtend": "YYYYMMDDTHHMMSS"
}
時間請使用當地時間(例如台灣時間不需要轉 UTC，直接填入數字)，如果沒有提到結束時間，預設為開始時間後 1 小時。`;

            const result = await callAPI(sysPrompt, input);
            if(result) {
                try {
                    let cleanJson = result.replace(/```json/g, '').replace(/```/g, '').trim();
                    const data = JSON.parse(cleanJson);
                    
                    document.getElementById('calOutput').innerHTML = `
                        <strong>📌 解析成功！</strong><br><br>
                        <strong>標題：</strong> ${data.summary}<br>
                        <strong>時間：</strong> ${data.dtstart} ~ ${data.dtend}<br>
                        <strong>地點：</strong> ${data.location || '無'}<br>
                        <strong>說明：</strong> ${data.description || '無'}<br>
                    `;
                    
                    // Generate ICS string
                    currentIcsData = 
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Antigravity//AI Cloud Assistant//TW
BEGIN:VEVENT
SUMMARY:${data.summary}
DTSTART;TZID=Asia/Taipei:${data.dtstart}
DTEND;TZID=Asia/Taipei:${data.dtend}
LOCATION:${data.location || ''}
DESCRIPTION:${data.description || ''}
END:VEVENT
END:VCALENDAR`;

                    document.getElementById('downloadIcsBtn').style.display = 'inline-block';

                } catch(e) {
                    document.getElementById('calOutput').textContent = "解析 JSON 失敗，請重試。\nAI 回應：\n" + result;
                }
            }
        }

        function downloadICS() {
            if(!currentIcsData) return;
            const blob = new Blob([currentIcsData], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "event.ics";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // --- Browser Script Logic ---
        async function processBrowser() {
            const input = document.getElementById('browserInput').value;
            const sysPrompt = `你是一個資深的 Python 自動化工程師。
使用者會要求你寫網頁爬蟲或瀏覽器自動化腳本。
1. 請只輸出完整的 Python 程式碼，絕對不要有 markdown \`\`\` 標記或其他廢話。
2. 預設使用 Selenium (加上 webdriver-manager)，並加上適當的中文註解。
3. 頂端請用註解寫出需要安裝的 pip 套件。`;

            const result = await callAPI(sysPrompt, input);
            if(result) {
                let cleanCode = result.replace(/```python/g, '').replace(/```/g, '').trim();
                currentPyCode = cleanCode;
                document.getElementById('browserOutput').textContent = currentPyCode;
                document.getElementById('downloadPyBtn').style.display = 'inline-block';
            }
        }

        function downloadPy() {
            if(!currentPyCode) return;
            const blob = new Blob([currentPyCode], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "browser_automation.py";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert("已複製到剪貼簿！");
            });
        }
    </script>
</body>
</html>
