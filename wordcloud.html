<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>即時文字雲互動大廳</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --theme-color: #ff007f;
            --theme-blue: #3186FF;
            --bg-color: #1a1a2e;
            --panel-bg: rgba(30, 30, 50, 0.85);
        }
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            background-image: radial-gradient(circle at top right, #3186FF33, transparent 40%),
                              radial-gradient(circle at bottom left, #ff007f33, transparent 40%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        h1 {
            margin: 0;
            font-size: 2em;
            color: var(--theme-blue);
            text-shadow: 0 0 10px rgba(49, 134, 255, 0.5);
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 90%;
            max-width: 1200px;
            margin-top: 30px;
            gap: 20px;
        }
        .input-panel {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .input-panel input {
            flex: 1;
            padding: 15px 20px;
            font-size: 1.2em;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            background: rgba(0,0,0,0.3);
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-panel input:focus {
            border-color: var(--theme-color);
        }
        .input-panel button {
            padding: 15px 30px;
            font-size: 1.2em;
            background: var(--theme-color);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            transition: transform 0.2s;
        }
        .input-panel button:hover {
            transform: scale(1.05);
        }
        .canvas-panel {
            flex: 1;
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 500px;
            position: relative;
        }
        #wordcloud-canvas {
            width: 100%;
            height: 100%;
            min-height: 500px;
        }
        .status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .status-badge.local { background: #ff9800; color: #fff; }
        .status-badge.firebase { background: #4caf50; color: #fff; }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .action-buttons button {
            background: transparent;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }
        .btn-import, .btn-export { border: 1px solid #4caf50; color: #4caf50; }
        .btn-import:hover, .btn-export:hover { background: rgba(76, 175, 80, 0.2); }
        .btn-qrcode { border: 1px solid #ff007f; color: #ff007f; }
        .btn-qrcode:hover { background: rgba(255, 0, 127, 0.2); }
        .btn-reset { border: 1px solid #ff5555; color: #ff5555; }
        .btn-reset:hover { background: rgba(255, 85, 85, 0.2); }

        #nickname-input { flex: 0 0 120px; }

        /* RWD 響應式設計 */
        @media (max-width: 768px) {
            .input-panel {
                flex-direction: column;
                gap: 10px;
                padding: 15px;
            }
            #nickname-input, #word-input, .input-panel button {
                width: 100%;
                flex: auto;
                box-sizing: border-box;
            }
            .action-buttons {
                justify-content: center;
            }
            .action-buttons button {
                flex: 1 1 45%;
                padding: 10px 5px;
            }
            h1 { font-size: 1.5em; }
            .status-badge {
                position: static;
                display: inline-block;
                margin-bottom: 10px;
            }
            .canvas-panel {
                flex-direction: column;
                min-height: 400px;
            }
            #wordcloud-canvas { min-height: 400px; }
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-cloud"></i> 即時文字雲互動大廳</h1>
        <p style="margin: 10px 0 0 0; color: #aaa;">大家一起輸入關鍵字，見證文字雲即時成形！</p>
    </header>

    <div class="container">
        <div class="input-panel">
            <input type="text" id="nickname-input" placeholder="您的暱稱" maxlength="10">
            <input type="text" id="word-input" placeholder="對 AI 的一個形容詞（如：神奇...）" maxlength="15">
            <button onclick="submitWord()"><i class="fa-solid fa-paper-plane"></i> 送出</button>
        </div>

        <div class="action-buttons">
            <input type="file" id="csv-file-input" accept=".csv" style="display: none;" onchange="handleCSVImport(event)">
            <button onclick="importCSV()" class="btn-import"><i class="fa-solid fa-file-import"></i> 匯入 CSV</button>
            <button onclick="exportCSV()" class="btn-export"><i class="fa-solid fa-file-export"></i> 匯出 CSV</button>
            <button onclick="showQRCode()" class="btn-qrcode"><i class="fa-solid fa-qrcode"></i> 顯示 QR Code</button>
            <button onclick="askResetPassword()" class="btn-reset"><i class="fa-solid fa-trash-can"></i> 重置資料</button>
        </div>

        <div class="canvas-panel">
            <div id="status" class="status-badge local">⚠️ 本機展示模式 (未連結資料庫)</div>
            <canvas id="wordcloud-canvas"></canvas>
        </div>
    </div>

    <!-- 載入 WordCloud2.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
    
    <!-- 載入 SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- 載入 Firebase (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // ==========================================
        // 教師請注意：如果您要讓全班手機連線，請替換為您的 Firebase 設定檔
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAquvHeM8PZtOANITlz6QoEx3GDNo_Ke5k",
            authDomain: "ai-chat-system-7c437.firebaseapp.com",
            databaseURL: "https://ai-chat-system-7c437-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ai-chat-system-7c437",
            storageBucket: "ai-chat-system-7c437.firebasestorage.app",
            messagingSenderId: "793003313602",
            appId: "1:793003313602:web:8a434a2138b7c8a95aae5b",
            measurementId: "G-RMSWFZXNK7"
        };

        let wordsArray = [];
        let isFirebaseActive = false;
        let isInitialLoad = true;
        let seenKeys = new Set();

        // 初始化
        function init() {
            if (firebaseConfig.apiKey) {
                // 方案 A：Firebase 即時連線
                firebase.initializeApp(firebaseConfig);
                const db = firebase.database();
                isFirebaseActive = true;
                document.getElementById('status').className = 'status-badge firebase';
                document.getElementById('status').innerHTML = '✅ Firebase 即時連線中';

                // 監聽雲端資料變動
                db.ref('wordcloud').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        wordsArray = Object.values(data);
                        renderWordCloud();
                        if (isInitialLoad) {
                            Object.keys(data).forEach(key => seenKeys.add(key));
                            isInitialLoad = false;
                        }
                    } else {
                        if (isInitialLoad) isInitialLoad = false;
                    }
                });

                // 監聽新增資料 (全域推播提示)
                db.ref('wordcloud').on('child_added', (snapshot) => {
                    if (isInitialLoad) return;
                    const key = snapshot.key;
                    if (!seenKeys.has(key)) {
                        seenKeys.add(key);
                        const item = snapshot.val();
                        const nickname = item.nickname || 'Unknown';
                        const word = item.text || '';
                        
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            icon: 'success',
                            title: `${nickname} 送出了：${word}`,
                            showConfirmButton: false,
                            timer: 2000,
                            timerProgressBar: true
                        });
                    }
                });
            } else {
                // 方案 B：本機 LocalStorage 展示 (雙視窗可見)
                document.getElementById('status').className = 'status-badge local';
                document.getElementById('status').innerHTML = '⚠️ 本機展示模式 (請補上 Firebase 設定以啟用多人連線)';
                
                const localData = localStorage.getItem('localWordCloud');
                if(localData) wordsArray = JSON.parse(localData);
                renderWordCloud();

                // 監聽同一台電腦其他分頁的變更
                window.addEventListener('storage', (e) => {
                    if (e.key === 'localWordCloud') {
                        wordsArray = JSON.parse(e.newValue || '[]');
                        renderWordCloud();
                    }
                });
            }
            
            // 處理 Enter 鍵
            document.getElementById('word-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') submitWord();
            });
            document.getElementById('nickname-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') document.getElementById('word-input').focus();
            });
            
            // 載入儲存的暱稱
            const savedNickname = localStorage.getItem('wordcloud_nickname');
            if (savedNickname) {
                document.getElementById('nickname-input').value = savedNickname;
            }
        }

        // 送出文字
        function submitWord() {
            const nicknameElement = document.getElementById('nickname-input');
            const inputElement = document.getElementById('word-input');
            const nickname = nicknameElement.value.trim();
            const word = inputElement.value.trim();

            if (!nickname) {
                Swal.fire({ title: '提醒', text: '請先輸入您的暱稱喔！', icon: 'warning', confirmButtonColor: '#ff007f' });
                return;
            }
            if (!word) return;

            // 儲存暱稱到本機
            localStorage.setItem('wordcloud_nickname', nickname);

            if (isFirebaseActive) {
                // 寫入 Firebase (加上暱稱紀錄)，全域推播交給 child_added 處理
                firebase.database().ref('wordcloud').push({ text: word, nickname: nickname, timestamp: firebase.database.ServerValue.TIMESTAMP });
            } else {
                // 寫入 LocalStorage
                wordsArray.push({ text: word, nickname: nickname });
                localStorage.setItem('localWordCloud', JSON.stringify(wordsArray));
                renderWordCloud();
                
                // 本機模式直接顯示小提示
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: `${nickname} 送出了：${word}`,
                    showConfirmButton: false,
                    timer: 1500,
                    timerProgressBar: true
                });
            }

            // 清空單字輸入框，保留暱稱
            inputElement.value = '';
        }

        // 繪製文字雲
        function renderWordCloud() {
            const canvas = document.getElementById('wordcloud-canvas');
            // 設定高解析度畫布
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            // 計算詞頻
            const counts = {};
            wordsArray.forEach(item => {
                const word = typeof item === 'string' ? item : item.text;
                counts[word] = (counts[word] || 0) + 1;
            });

            // 轉為 wordcloud2.js 格式 [ [字, 權重], ... ]
            const list = Object.keys(counts).map(word => [word, counts[word] * 15 + 20]); // 放大權重

            WordCloud(canvas, {
                list: list,
                fontFamily: 'Inter, Noto Sans TC, sans-serif',
                fontWeight: 'bold',
                color: function (word, weight) {
                    // 隨機科技感顏色
                    const colors = ['#3186FF', '#ff007f', '#42b983', '#bd93f9', '#ffb86c'];
                    return colors[Math.floor(Math.random() * colors.length)];
                },
                rotateRatio: 0.3,
                backgroundColor: 'transparent',
                shrinkToFit: true,
                drawOutOfBound: false,
                gridSize: 10
            });
        }

        // 視窗大小改變時重繪
        window.addEventListener('resize', () => {
            setTimeout(renderWordCloud, 300);
        });

        // ==========================================
        // 功能：重置密碼檢查與清空資料
        // ==========================================
        async function askResetPassword() {
            const { value: password } = await Swal.fire({
                title: '清空文字雲資料',
                input: 'password',
                inputLabel: '請輸入重置密碼',
                inputPlaceholder: '請輸入密碼',
                showCancelButton: true,
                confirmButtonColor: '#ff5555',
                cancelButtonColor: '#555',
                confirmButtonText: '確認清空',
                cancelButtonText: '取消'
            });

            if (password) {
                if (password === '520') { // 可以改成您想要的密碼
                    if (isFirebaseActive) {
                        firebase.database().ref('wordcloud').remove().then(() => {
                            Swal.fire('已清空!', '雲端資料已重置。', 'success');
                            wordsArray = [];
                            renderWordCloud();
                        });
                    } else {
                        localStorage.removeItem('wordcloud_data');
                        wordsArray = [];
                        renderWordCloud();
                        Swal.fire('已清空!', '本機資料已重置。', 'success');
                    }
                } else {
                    Swal.fire('密碼錯誤', '無法清空資料。', 'error');
                }
            }
        }

        // ==========================================
        // 功能：顯示 QR Code
        // ==========================================
        function showQRCode() {
            const currentUrl = window.location.href;
            const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(currentUrl)}`;
            Swal.fire({
                title: '掃描加入文字雲大廳',
                text: '拿起手機掃描，立刻一起互動！',
                imageUrl: qrCodeUrl,
                imageWidth: 250,
                imageHeight: 250,
                imageAlt: 'QR Code',
                confirmButtonColor: '#ff007f',
                confirmButtonText: '關閉'
            });
        }

        // ==========================================
        // 功能：匯出與匯入 CSV
        // ==========================================
        function exportCSV() {
            if (wordsArray.length === 0) {
                Swal.fire('沒有資料', '目前沒有文字可以匯出。', 'info');
                return;
            }
            const header = "Nickname,Word\n";
            const lines = wordsArray.map(item => {
                const w = typeof item === 'string' ? item : item.text;
                const n = (typeof item === 'string' ? '' : item.nickname) || 'Unknown';
                // 簡易處理 CSV 欄位可能有的逗號
                const safeN = `"${n.replace(/"/g, '""')}"`;
                const safeW = `"${w.replace(/"/g, '""')}"`;
                return `${safeN},${safeW}`;
            });
            const csvContent = "\uFEFF" + header + lines.join('\n'); // 加入 BOM
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "wordcloud_data_with_nicknames.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function importCSV() {
            document.getElementById('csv-file-input').click();
        }

        function handleCSVImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                let content = e.target.result;
                if (content.charCodeAt(0) === 0xFEFF) {
                    content = content.substr(1);
                }
                const lines = content.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
                
                if (lines.length === 0) {
                    Swal.fire('匯入失敗', '檔案中沒有有效的文字。', 'error');
                    return;
                }

                // 判斷是否有標題列 (Nickname,Word)
                let startIndex = 0;
                if (lines[0].toLowerCase().includes('nickname') || lines[0].toLowerCase().includes('word')) {
                    startIndex = 1;
                }

                const entries = [];
                for (let i = startIndex; i < lines.length; i++) {
                    const line = lines[i];
                    // 簡易解析：尋找逗號。如果有雙引號則去除。
                    const parts = line.split(',');
                    let nickname = 'System';
                    let word = '';
                    if (parts.length >= 2) {
                        nickname = parts[0].replace(/^"|"$/g, '').trim();
                        word = parts[1].replace(/^"|"$/g, '').trim();
                    } else {
                        word = parts[0].replace(/^"|"$/g, '').trim();
                    }
                    if (word) entries.push({ nickname, text: word });
                }

                if (entries.length === 0) {
                    Swal.fire('匯入失敗', '檔案格式錯誤，找不到文字內容。', 'error');
                    return;
                }

                if (isFirebaseActive) {
                    const db = firebase.database();
                    const updates = {};
                    const timestamp = Date.now();
                    entries.forEach((entry, index) => {
                        const newKey = db.ref('wordcloud').push().key;
                        updates['/wordcloud/' + newKey] = {
                            text: entry.text,
                            nickname: entry.nickname,
                            timestamp: timestamp + index
                        };
                    });
                    db.ref().update(updates).then(() => {
                        Swal.fire('匯入成功', `成功匯入 ${entries.length} 筆文字！`, 'success');
                    }).catch((error) => {
                        Swal.fire('匯入失敗', error.message, 'error');
                    });
                } else {
                    wordsArray = wordsArray.concat(entries);
                    localStorage.setItem('wordcloud_data', JSON.stringify(wordsArray));
                    renderWordCloud();
                    Swal.fire('匯入成功', `成功匯入 ${entries.length} 筆文字！`, 'success');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        // 啟動
        init();
    </script>
</body>
</html>
